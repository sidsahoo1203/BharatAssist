name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend + ML tests, Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r ml/requirements.txt pytest httpx

      - name: Safety guard API tests
        working-directory: backend
        run: pytest -q test_safety_guard.py

      - name: ML unit tests
        working-directory: ml
        run: pytest -q

      - name: Build Docker image
        run: docker build -t bharatassist-backend .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build